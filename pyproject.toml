[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-public-audit"
version = "0.2.0"
description = "Scan S3 buckets for public exposure (ACLs, policies, Block Public Access) and produce a remediation plan."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "s3", "security", "audit", "compliance", "boto3", "cloud", "devops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "boto3>=1.43",
    "rich>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/moveeeax/s3-public-audit"
Repository = "https://github.com/moveeeax/s3-public-audit"

[project.scripts]
s3-public-audit = "s3_public_audit.cli:main"

[tool.setuptools.packages.find]
include = ["s3_public_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
