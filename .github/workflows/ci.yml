name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Smoke (offline scan on example fixture)
        run: |
          set +e
          python -m s3_public_audit scan --input examples/buckets.json --format table
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

      - name: Smoke (JSON + SARIF)
        run: |
          python -m s3_public_audit scan --input examples/buckets.json --format json
          python -m s3_public_audit scan --input examples/buckets.json --format sarif
